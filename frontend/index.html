<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viewer</title>
    <link rel="icon" href="./gopher.png" />
  </head>
  <body class="no-doc" data-file-drop-target>
    <script>
      // A window opened for files shows its loading bar from the first paint,
      // before the app's script has even loaded.
      if (new URLSearchParams(location.search).has('opening')) document.body.classList.add('loading');
    </script>
    <!-- Icons: Lucide (ISC licence), 24px grid, drawn with currentColor. -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-open" viewBox="0 0 24 24">
        <path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" />
      </symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" /></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24">
        <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
        <path d="m9 12 2 2 4-4" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
      <!-- Window controls: hairline glyphs on a 16px grid. -->
      <symbol id="w-min" viewBox="0 0 16 16"><path d="M4 8h8" /></symbol>
      <symbol id="w-max" viewBox="0 0 16 16"><rect x="4.5" y="4.5" width="7" height="7" rx="1" /></symbol>
      <symbol id="w-close" viewBox="0 0 16 16"><path d="m4.5 4.5 7 7m0-7-7 7" /></symbol>
    </svg>

    <header class="toolbar">
      <img class="logo" src="./gopher.png" alt="" width="18" height="18" />
      <button id="open" type="button" class="icon" title="Open (Ctrl+O)" aria-label="Open">
        <svg><use href="#i-open" /></svg>
      </button>

      <div class="group needs-doc" role="group" aria-label="Pages">
        <button id="prev" type="button" class="icon" title="Previous page (←)" aria-label="Previous page">
          <svg><use href="#i-left" /></svg>
        </button>
        <input id="page" type="text" inputmode="numeric" value="1" aria-label="Page number" />
        <span id="pages">/ 0</span>
        <button id="next" type="button" class="icon" title="Next page (→)" aria-label="Next page">
          <svg><use href="#i-right" /></svg>
        </button>
      </div>

      <div class="group needs-doc" role="group" aria-label="Zoom">
        <button id="zoom-out" type="button" class="icon" title="Zoom out (Ctrl+−)" aria-label="Zoom out">
          <svg><use href="#i-minus" /></svg>
        </button>
        <label class="select">
          <select id="zoom" aria-label="Zoom"></select>
          <svg><use href="#i-chevron" /></svg>
        </label>
        <button id="zoom-in" type="button" class="icon" title="Zoom in (Ctrl++)" aria-label="Zoom in">
          <svg><use href="#i-plus" /></svg>
        </button>
      </div>

      <div class="spacer"></div>

      <label class="find needs-doc">
        <svg><use href="#i-search" /></svg>
        <input id="find" type="search" placeholder="find" aria-label="Find in document (Ctrl+F)" />
        <span id="find-count" aria-live="polite"></span>
      </label>

      <button id="pdfa" type="button" class="icon needs-doc" aria-pressed="false" title="PDF/A validation and conversion" aria-label="PDF/A">
        <svg><use href="#i-shield" /></svg>
      </button>

      <div class="window-controls" role="group" aria-label="Window">
        <button id="win-min" type="button" class="icon" title="Minimise" aria-label="Minimise"><svg><use href="#w-min" /></svg></button>
        <button id="win-max" type="button" class="icon" title="Maximise" aria-label="Maximise"><svg><use href="#w-max" /></svg></button>
        <button id="win-close" type="button" class="icon close" title="Close" aria-label="Close"><svg><use href="#w-close" /></svg></button>
      </div>
    </header>

    <nav id="tabs" hidden aria-label="Documents">
      <div id="tab-list" role="tablist"></div>
      <button id="tab-new" type="button" class="icon" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg><use href="#i-plus" /></svg>
      </button>
    </nav>

    <main>
      <section class="empty">
        <img src="./gopher.png" alt="" width="48" height="48" />
        <p>no document open</p>
        <p class="hint"><kbd>Ctrl</kbd> <kbd>O</kbd> to open, or drop a PDF here</p>
        <button id="empty-open" type="button" class="text">open file…</button>
      </section>

      <div id="progress" aria-hidden="true"></div>
      <div id="container"><div class="pdfViewer"></div></div>

      <aside id="panel" hidden aria-label="PDF/A">
        <header>
          <span class="title">pdf/a</span>
          <button id="panel-close" type="button" class="icon" aria-label="Close panel"><svg><use href="#i-x" /></svg></button>
        </header>
        <p id="doc-name"></p>
        <p id="doc-meta" class="meta"></p>
        <div class="controls">
          <label class="select wide">
            <select id="profile" aria-label="Profile"></select>
            <svg><use href="#i-chevron" /></svg>
          </label>
          <button id="verify" type="button" class="text primary">verify</button>
          <button id="convert" type="button" class="text" title="Save a conformant copy">convert…</button>
          <button id="cancel" type="button" class="text" hidden>cancel</button>
        </div>
        <div id="result" aria-live="polite"></div>
      </aside>
    </main>

    <footer class="statusbar">
      <span id="status-file"></span>
      <span id="toast" role="status" hidden></span>
      <span class="spacer"></span>
      <span id="claimed" hidden></span>
      <span id="status-zoom"></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
